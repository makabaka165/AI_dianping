hmdp:
  cache:
    ttl-jitter-minutes: 5
    mutex:
      wait-timeout-millis: 300
      lease-time-seconds: 10
    logical:
      min-physical-ttl-minutes: 10
    rebuild-executor:
      core-size: 4
      max-size: 10
      queue-capacity: 100
      keep-alive-seconds: 60
      await-termination-seconds: 10
  blog:
    hot-cache-size: 100
    like-top-limit: 5
    feed-page-size: 10
    feed-fetch-multiplier: 2
    feed-inbox-max-size: 1000
    large-author-fans-threshold: 10000
  ai:
    redis-health-check: true
    redisson-fallback: false
    model:
      timeout-seconds: ${HMDP_AI_MODEL_TIMEOUT_SECONDS:30}
    resilience:
      max-concurrent-calls: ${HMDP_AI_MAX_CONCURRENT_CALLS:8}
      rate-limit-period-seconds: ${HMDP_AI_RATE_LIMIT_PERIOD_SECONDS:1}
      rate-limit-permits: ${HMDP_AI_RATE_LIMIT_PERMITS:2}
    prompt:
      canary:
        enabled: ${HMDP_AI_PROMPT_CANARY_ENABLED:false}
        ratio: ${HMDP_AI_PROMPT_CANARY_RATIO:0}
      stable:
        summary: shop-summary-v3
        quality-summary: shop-quality-summary-v2
        qa: shop-qa-v3
        compare: shop-compare-v3
        recommend: shop-recommend-v3
      canary-version:
        summary: shop-summary-v3
        quality-summary: shop-quality-summary-v2
        qa: shop-qa-v3
        compare: shop-compare-v3
        recommend: shop-recommend-v3
  cors:
    allowed-origin-patterns: ${HMDP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*}
  voucher:
    order:
      pay-timeout-minutes: 15
      close-scan-limit: 100
      close-scan-fixed-delay-millis: 60000
      close-scan-initial-delay-millis: 60000

server:
  port: 8081

spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  redis:
    host: 127.0.0.1
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mybatis-plus:
  type-aliases-package: com.hmdp.entity

sa-token:
  token-name: authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: true

logging:
  level:
    com.hmdp: info
    dev.langchain4j: warn
    dev.langchain4j.model.openai: warn
    org.apache.http.wire: warn
  pattern:
    dateformat: mm:ss.SSS

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      model-name: qwen-plus
      temperature: 0.3
      max-tokens: 1000
      log-requests: false
      log-responses: false
    streaming-chat-model:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen-plus
      temperature: 0.3
      max-tokens: 1000
      log-requests: false
      log-responses: false
    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      model-name: text-embedding-v3
      log-requests: false
      log-responses: false
      max-segments-per-batch: 10

chat:
  memory:
    max-messages: 20
    redis:
      key-prefix: "chat:memory:"
      ttl: 7200

rag:
  enabled: true
  data:
    auto-import: true
  review:
    enabled: true
    min-score: 0.55
    max-vector-candidates: 20
    backfill-page-size: 200
  redis:
    host: 127.0.0.1
    port: 6380
    index-name: shop_knowledge_base
    dimension: 1024
    fallback-to-memory: false
