server:
  port: 8081  # 更改端口以避免冲突
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: woleigequ
  redis:
    host: 127.0.0.1
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段



mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
sa-token:
  token-name: authorization
  token-prefix: Bearer
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: true

logging:
  level:
    com.hmdp: debug
    # 添加以下配置，打开LangChain4j和Apache HttpClient的DEBUG日志
    dev.langchain4j: debug
    dev.langchain4j.model.openai: debug
    org.apache.http.wire: debug
  pattern:
    dateformat: mm:ss.SSS


# application.yml
langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}
      model-name: qwen-plus
      temperature: 0.3
      max-tokens: 1000
      log-requests: true
      log-responses: true

#      top-p: 0.9       # 控制生成多样性
#      frequency-penalty: 0.1  # 减少重复内容
    streaming-chat-model:  # 添加流式模型配置
      api-key: ${DASHSCOPE_API_KEY}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen-plus
      temperature: 0.3
      max-tokens: 1000
      log-requests: true
      log-responses: true

    embedding-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${DASHSCOPE_API_KEY}  # 修复这里，原来是API-KEY
      model-name: text-embedding-v3        # 使用阿里云的嵌入模型
      log-requests: true
      log-responses: true
      max-segments-per-batch: 10



# 自定义配置
chat:
  memory:
    max-messages: 20  # 单个会话最大消息数
    redis:
      key-prefix: "chat:memory:"  # Redis key 前缀
      ttl: 7200  # 过期时间（秒），2小时


# → 添加RAG配置
rag:
  enabled: true
  data:
    auto-import: true
  redis:
    host: 127.0.0.1
    port: 6379
    index-name: shop_knowledge_base
    dimension: 1024  # text-embedding-v3的维度
