spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
hmdp:
  ai:
    redis:
      business:
        host: ${REDIS_HOST}
        port: ${REDIS_PORT}
        password: ${REDIS_PASSWORD}
      memory:
        host: ${MEMORY_REDIS_HOST}
        port: ${MEMORY_REDIS_PORT}
        password: ${MEMORY_REDIS_PASSWORD}
      vector:
        host: ${VECTOR_REDIS_HOST}
        port: ${VECTOR_REDIS_PORT}
        password: ${VECTOR_REDIS_PASSWORD}
langchain4j:
  open-ai:
    chat-model:
      base-url: ${AI_CHAT_BASE_URL}
      api-key: ${AI_CHAT_API_KEY}
      model-name: ${AI_CHAT_MODEL}
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: ${AI_CHAT_BASE_URL}
      api-key: ${AI_CHAT_API_KEY}
      model-name: ${AI_CHAT_MODEL}
      log-requests: false
      log-responses: false
    embedding-model:
      base-url: ${AI_EMBEDDING_BASE_URL}
      api-key: ${AI_EMBEDDING_API_KEY}
      model-name: ${AI_EMBEDDING_MODEL}
      log-requests: false
      log-responses: false
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
logging:
  level:
    dev.langchain4j: warn
    dev.langchain4j.model.openai: warn
    org.apache.http.wire: off
