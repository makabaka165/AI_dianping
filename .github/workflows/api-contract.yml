name: API contract verification

on:
  push:
    branches: [main, feat/full-agent-backend-platform]
  pull_request:

permissions:
  contents: read

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate OpenAPI syntax and references
        run: npx --yes @redocly/cli@1.25.5 lint docs/api/openapi.yaml
      - name: Compare Controller paths and DTO schemas with OpenAPI
        run: mvn -B -ntp -Dtest=OpenApiControllerContractTest test
