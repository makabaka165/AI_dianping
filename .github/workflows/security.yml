name: Security verification

on:
  push:
    branches: [main, feat/full-agent-backend-platform]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Scan the checked-out tree for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2
          detect --source=/repo --no-git --redact
      - name: Scan runtime dependencies
        run: >-
          mvn -B -ntp org.owasp:dependency-check-maven:10.0.4:check
          -DfailBuildOnCVSS=9 -DskipTestScope=true
      - name: Run permission, SSRF and path traversal regressions
        run: >-
          mvn -B -ntp
          -Dtest=AiPermissionHandlerScanTest,AnonymousAiManagementAccessTest,SafeHttpClientTest,FilePathTraversalTest,SandboxFileServiceTest
          test
