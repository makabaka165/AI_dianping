name: Full integration verification

on:
  push:
    branches: [main, feat/full-agent-backend-platform]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Validate Compose configuration
        run: docker compose -f docker-compose.ai.yml config
      - name: Start MySQL, Redis, Redis Stack and MinIO
        run: docker compose -f docker-compose.ai.yml up -d --wait
      - name: Run full integration profile
        run: mvn -B -ntp clean verify -Pfull-integration
      - name: Print infrastructure logs on failure
        if: failure()
        run: docker compose -f docker-compose.ai.yml logs --no-color
      - name: Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.ai.yml down -v
