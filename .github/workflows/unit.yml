name: Unit verification

on:
  push:
    branches: [main, feat/full-agent-backend-platform]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: Compile, test, verify architecture and formatting
        run: mvn -B -ntp clean verify
