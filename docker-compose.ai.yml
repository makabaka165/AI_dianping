services:
  mysql:
    image: mysql:8.0.37
    container_name: hmdp-ai-mysql
    environment:
      MYSQL_DATABASE: ${AI_MYSQL_DATABASE:-hmdp}
      MYSQL_ROOT_PASSWORD: ${AI_MYSQL_ROOT_PASSWORD:-change_me_local}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports: ["127.0.0.1:${AI_MYSQL_PORT:-3307}:3306"]
    volumes:
      - ai_mysql_data:/var/lib/mysql
      - ./src/main/resources/db/hmdp.sql:/docker-entrypoint-initdb.d/00-hmdp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.2-alpine
    container_name: hmdp-ai-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${AI_REDIS_PORT:-6381}:6379"]
    volumes: ["ai_redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis-stack:
    image: redis/redis-stack-server:7.2.0-v13
    container_name: hmdp-ai-redis-stack
    ports: ["127.0.0.1:${AI_REDIS_STACK_PORT:-6380}:6379"]
    volumes: ["ai_redis_stack_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: hmdp-ai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AI_MINIO_ROOT_USER:-local_minio_user}
      MINIO_ROOT_PASSWORD: ${AI_MINIO_ROOT_PASSWORD:-change_me_local_minio}
    ports:
      - "127.0.0.1:${AI_MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${AI_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: ["ai_minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${AI_MINIO_ROOT_USER:-local_minio_user}
      MINIO_ROOT_PASSWORD: ${AI_MINIO_ROOT_PASSWORD:-change_me_local_minio}
      MINIO_BUCKET: ${AI_MINIO_BUCKET:-hmdp-ai}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/$$MINIO_BUCKET &&
        touch /tmp/minio-init-ready &&
        tail -f /dev/null
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/minio-init-ready"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

volumes:
  ai_mysql_data:
  ai_redis_data:
  ai_redis_stack_data:
  ai_minio_data:
